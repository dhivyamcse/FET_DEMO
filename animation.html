<html>
<head>
<title>CSS Animation</title>
<style>
.box{
width:100px;
height:100px;
background-color:blue;
animation:moveBox 3s infinite;
}
@keyframes moveBox {
from {
transform:translateX(0);
}
to {
transform:translate(400px)
}
}
</style>
</head>
<body>
<h1>CSS Animation Example</h1>
<div class="box"></div> 
</body>
</html>
