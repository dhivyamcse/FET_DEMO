<html>
<head>
  <title> Logical Operators </title>
</head>
<body>
<h2> JavaScript Logical Operators </h2>
<script>
let age = 20;
let hasID = true;
document.write("Age : " +age+ "<br>");
document.write("Has ID : " +hasID+ "<br>");

document.write("Age>=18 AND HasID : " +(age>=18 && hasID)+ "<br>");
document.write("Age<18 OR HasID : " +(age<18 || hasID)+ "<br>");
document.write("Not hasID : " +(!hasID)+ "<br>");
</script>
</body>
</html>
